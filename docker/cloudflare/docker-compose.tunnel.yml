# Cloudflare Tunnel untuk ServiceKU (token-based / remotely managed)
#
# Cara penggunaan:
# 1. Buat tunnel di dashboard Cloudflare:
#    Cloudflare Zero Trust -> Networks -> Tunnels -> Create a tunnel
#    Pilih "Cloudflared" -> "Remotely managed" -> salin token (eyJh...)
# 2. Salin .env.tunnel.example ke .env lalu isi TUNNEL_TOKEN
# 3. Atur public hostname di dashboard: serviceku.my.id -> http://serviceku-app:8080
#    (app berjalan di network serviceku_serviceku-network, port internal 8080)
# 4. Jalankan: docker compose --env-file .env -f docker-compose.tunnel.yml up -d

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: serviceku-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - serviceku-network

networks:
  serviceku-network:
    external: true
    name: serviceku_serviceku-network

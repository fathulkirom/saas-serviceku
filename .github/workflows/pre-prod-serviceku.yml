name: 🔐 ServiceKU Pre‑Production Pipeline

on:
  push:
    branches: [ main, staging ]
  workflow_dispatch:  # Bisa juga dijalankan manual

env:
  # composer.lock berisi symfony 8.1 yang butuh php >=8.4.1
  # sehingga CI harus pakai PHP 8.4 (bukan 8.2)
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'
  # NOTE: JANGAN set APP_ENV di sini. Jika diset (mis. 'staging'),
  # nilai ini bocor ke semua job termasuk unit test & membuat
  # HealthTest::test_environment_is_set_to_testing gagal.
  # App env dikontrol via .env.staging (php artisan) & phpunit.xml (force=true).
  DB_CONNECTION: sqlite
  # Central DB (SQLite) — dipakai untuk job migrasi & test di CI
  DB_DATABASE: database/central.sqlite
  # Token GitHub untuk membuat Issue dan deployment.
  # Default github.token (otomatis); override dengan secret GH_TOKEN jika perlu
  # permission tambahan (scope issues & workflow).
  GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
  # URL staging (ganti dengan milikmu)
  STAGING_URL: https://staging.serviceku.app

jobs:
  # ────────────────────────────────────────
  # 1. Environment & Dependencies Check
  # ────────────────────────────────────────
  setup-and-lint:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.composer-cache.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install Node dependencies
        run: npm ci

      - name: Check .env.staging exists & valid
        run: |
          cp .env.staging .env || (echo "::error::.env.staging missing" && exit 1)
          # Cek placeholder berbahaya (GANTI_/changeme/your-), bukan nilai kosong opsional
          if grep -qE "changeme|your-|GANTI_|your_password" .env.staging; then
            echo "::error::.env.staging contains placeholder values!"
            gh issue create --title "[PRE-PROD] Environment variables contain placeholder" --body "File .env.staging masih ada placeholder. Segera isi dengan nilai asli." --label "blocker,environment"
            exit 1
          fi
          echo "✅ .env.staging valid"

      - name: Lint PHP (Laravel Pint) — warning only
        run: ./vendor/bin/pint --test || true

      # ESLint belum dipasang di project; ganti dengan build check frontend
      - name: Build Check Frontend (Vite)
        run: npm run build

  # ────────────────────────────────────────
  # 2. Database Migration & Rollback (Central)
  # ────────────────────────────────────────
  database-central:
    needs: setup-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.staging .env && php artisan key:generate
      - name: Prepare Central SQLite DB
        run: |
          mkdir -p database
          touch database/central.sqlite
      - name: Run Central Migration
        run: php artisan migrate --force
      - name: Rollback Central Migration
        run: php artisan migrate:rollback --force
      - name: Migrate again (verify downgrade + upgrade cycle)
        run: php artisan migrate --force
      - name: Seed Central (optional)
        run: php artisan db:seed --force --class=PlanSeeder || true

  # ────────────────────────────────────────
  # 3. Unit & Integration Tests (Central + Tenant)
  # ────────────────────────────────────────
  unit-integration-tests:
    needs: database-central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP (dengan PCOV untuk coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: pcov
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci
      - run: cp .env.staging .env && php artisan key:generate
      - run: |
          mkdir -p database
          touch database/central.sqlite
          php artisan migrate --force

      - name: Run Backend Tests (PHPUnit + coverage)
        run: php -d pcov.enabled=1 vendor/bin/phpunit --coverage-text
        continue-on-error: true
        id: backend-test

      # Vitest tidak terpasang di project; pakai build check sebagai smoke frontend
      - name: Build Check Frontend (Vite)
        run: npm run build
        continue-on-error: true
        id: frontend-build

      - name: Create Issue if Backend Tests Fail
        if: steps.backend-test.outcome == 'failure'
        run: |
          gh issue create --title "[TEST] Backend unit/integration failure" \
            --body "Terjadi kegagalan backend tests. Detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug,backend"

      - name: Create Issue if Frontend Build Fails
        if: steps.frontend-build.outcome == 'failure'
        run: |
          gh issue create --title "[TEST] Frontend build failure" \
            --body "npm run build gagal. Detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug,frontend"

      - name: Fail job if any test failed
        if: steps.backend-test.outcome == 'failure' || steps.frontend-build.outcome == 'failure'
        run: exit 1

  # ────────────────────────────────────────
  # 4. Multi‑Tenancy Isolation Tests
  # ────────────────────────────────────────
  multi-tenancy-security:
    needs: unit-integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: cp .env.staging .env && php artisan key:generate
      - run: |
          mkdir -p database
          touch database/central.sqlite
          php artisan migrate --force

      # Command tenant:create / tenancy:test-isolation TIDAK ada di project.
      # Diganti dengan PHPUnit TenantIsolationTest yang sudah dibuat:
      # tests/Feature/TenantIsolationTest.php (verifikasi isolasi data antar tenant).
      - name: Multi-Tenancy Isolation Tests (PHPUnit)
        run: php artisan test --filter=TenantIsolationTest
        continue-on-error: true
        id: isolation

      - name: Create Issue on Isolation Breach
        if: steps.isolation.outcome == 'failure'
        run: |
          gh issue create --title "[SECURITY] Multi-tenant isolation breach" \
            --body "Tenant B bisa mengakses data Tenant A. Jalankan: php artisan test --filter=TenantIsolationTest. Detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "blocker,security"
          exit 1

  # ────────────────────────────────────────
  # 5. E2E Tests (Critical User Journeys)
  # ────────────────────────────────────────
  e2e-tests:
    needs: multi-tenancy-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci

      - name: Prepare app & database
        run: |
          cp .env.staging .env
          php artisan key:generate
          mkdir -p database
          touch database/central.sqlite
          php artisan migrate --force
          php artisan db:seed --force --class=PlanSeeder

      # Frontend harus di-build dulu, kalau tidak: "Vite manifest not found"
      - name: Build Frontend (Vite)
        run: npm run build

      - run: npx playwright install --with-deps chromium

      # Config Playwright berada di e2e/playwright.config.js (baseURL localhost:8000)
      # NOTE: pakai `php -S` LANGSUNG, bukan `php artisan serve`. Ada quirk di mana
      # `php artisan serve` (built-in server via server.php) TIDAK membaca APP_KEY
      # dari .env -> error "No application encryption key has been specified" (500).
      # `php -S ... public/index.php` membaca .env dengan benar (sudah terverifikasi).
      # pakai 127.0.0.1 (bukan localhost) karena di runner Ubuntu localhost bisa
      # resolve ke ::1 (IPv6) sedangkan server hanya listen di IPv4.
      - name: Start Laravel server
        run: |
          php -S 127.0.0.1:8000 -t public public/index.php > /tmp/laravel-server.log 2>&1 &
          echo $! > /tmp/laravel.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "✅ Server siap setelah ${i}s (HTTP $code)"
              break
            fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 2>/dev/null || echo "000")
          if [ "$code" = "000" ]; then
            echo "❌ Server gagal start (no response):"; cat /tmp/laravel-server.log; exit 1;
          fi

      - name: Run E2E Tests (Playwright)
        run: npx playwright test --config=e2e/playwright.config.js
        continue-on-error: true
        id: e2e

      - name: Create Issue on E2E Failure
        if: steps.e2e.outcome == 'failure'
        run: |
          gh issue create --title "[E2E] Critical user journey broken" \
            --body "Lihat report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug,e2e"

      - name: Fail if E2E failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1

      - name: Stop Laravel server
        if: always()
        run: kill $(cat /tmp/laravel.pid) 2>/dev/null || true

  # ────────────────────────────────────────
  # 5b. API Contract Tests (Newman + Schemathesis)
  # ────────────────────────────────────────
  api-contract-tests:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python (Schemathesis)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: composer install --prefer-dist --no-progress --no-interaction
      - run: npm ci

      - name: Install Newman
        run: npm install -g newman

      # venv agar aman dari PEP 668 (externally-managed python)
      - name: Install Schemathesis (venv)
        run: |
          python -m venv /tmp/schemathesis-venv
          /tmp/schemathesis-venv/bin/pip install --quiet schemathesis

      - name: Prepare app & database
        run: |
          cp .env.staging .env
          php artisan key:generate
          mkdir -p database
          touch database/central.sqlite
          php artisan migrate --force
          php artisan db:seed --force --class=PlanSeeder

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Start Laravel server
        run: |
          php -S 127.0.0.1:8000 -t public public/index.php > /tmp/laravel-server.log 2>&1 &
          echo $! > /tmp/laravel.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 2>/dev/null || echo "000")
            if [ "$code" != "000" ]; then
              echo "✅ Server siap setelah ${i}s (HTTP $code)"
              break
            fi
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000 2>/dev/null || echo "000")
          if [ "$code" = "000" ]; then
            echo "❌ Server gagal start:"; cat /tmp/laravel-server.log; exit 1;
          fi

      - name: Run Newman (E2E contract collection)
        run: newman run tests/contract/serviceku.postman_collection.json --env-var "baseUrl=http://127.0.0.1:8000"
        continue-on-error: true
        id: newman

      - name: Run Schemathesis (OpenAPI contract)
        run: /tmp/schemathesis-venv/bin/schemathesis run tests/contract/openapi.yaml --url http://127.0.0.1:8000 --checks all --max-examples 5
        continue-on-error: true
        id: schemathesis

      - name: Create Issue on Contract Failure
        if: steps.newman.outcome == 'failure' || steps.schemathesis.outcome == 'failure'
        run: |
          gh issue create --title "[PRE-PROD] API contract violation" \
            --body "Contract test gagal. Newman: ${{ steps.newman.outcome }}, Schemathesis: ${{ steps.schemathesis.outcome }}. Detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug,api"

      - name: Fail if contract tests failed
        if: steps.newman.outcome == 'failure' || steps.schemathesis.outcome == 'failure'
        run: exit 1

      - name: Stop Laravel server
        if: always()
        run: kill $(cat /tmp/laravel.pid) 2>/dev/null || true

  # ────────────────────────────────────────
  # 6. Performance & Load Testing
  # ────────────────────────────────────────
  performance-test:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging (simulasi)
        run: echo "Assume staging is already running at $STAGING_URL"

      # NOTE: env context tidak tersedia di job-level if. Pakai guard-step.
      # Skip k6 jika STAGING_URL masih placeholder (belum ada server staging asli).
      - name: Check staging configured
        id: staging
        run: |
          if [ "$STAGING_URL" != "https://staging.serviceku.app" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run k6 Load Test
        if: steps.staging.outputs.enabled == 'true'
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/staging-smoke.js
          flags: --vus 50 --duration 60s
        continue-on-error: true
        id: load

      - name: Check k6 thresholds
        if: steps.load.outcome == 'failure'
        run: |
          gh issue create --title "[PERF] Performance regression di Staging" \
            --body "p95 latency > 500ms atau error rate > 1%. Detail: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "performance,blocker"
          exit 1

      # Sinkron dengan guard: jika STAGING_URL placeholder, deploy ke staging
      # tidak terjadi sehingga job dianggap sukses (skip).
      - name: Skip notice
        if: steps.staging.outputs.enabled == 'false'
        run: echo "⚠️ STAGING_URL masih placeholder — performance test di-skip."

  # ────────────────────────────────────────
  # 7. Security Scan (SAST + Dependencies)
  # ────────────────────────────────────────
  security-scan:
    needs: e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with: { php-version: '${{ env.PHP_VERSION }}' }
      - run: composer install --prefer-dist --no-progress --no-interaction

      # symfony security:check sudah deprecated; pakai composer audit (bawaan Composer 2)
      - name: PHP Dependency Audit (composer audit)
        run: |
          composer audit --format=table || (
            gh issue create --title "[SECURITY] PHP dependency vulnerability" \
              --body "Terdapat kerentanan di composer.lock. Jalankan 'composer audit' untuk detail." \
              --label "security,blocker"
            exit 1
          )

      - name: Frontend Dependency Audit
        run: |
          npm audit --audit-level=high || (
            gh issue create --title "[SECURITY] NPM high vulnerability" \
              --body "Segera update package.json. npm audit untuk detail." \
              --label "security"
            # tidak exit 1 agar tidak blocking
          )

  # ────────────────────────────────────────
  # 8. Final Smoke Test & Approval Gate
  # ────────────────────────────────────────
  smoke-test-and-approval:
    needs: [performance-test, security-scan, multi-tenancy-security]
    runs-on: ubuntu-latest
    environment:
      name: production-approval   # Environment dengan proteksi manual
      url: https://serviceku.my.id
    steps:
      # NOTE: env context tidak tersedia di job-level if. Pakai guard-step.
      # Smoke test & approval di-skip jika STAGING_URL masih placeholder.
      - name: Check staging configured
        id: staging
        run: |
          if [ "$STAGING_URL" != "https://staging.serviceku.app" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke Test (Staging)
        if: steps.staging.outputs.enabled == 'true'
        run: |
          curl -fsS $STAGING_URL || (gh issue create --title "[SMOKE] Homepage not 200" --label "blocker,staging" && exit 1)
          curl -fsS $STAGING_URL/api/health || (gh issue create --title "[SMOKE] Health endpoint down" --label "blocker,staging" && exit 1)

      - name: Approval Request (manual)
        if: steps.staging.outputs.enabled == 'true'
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GH_TOKEN || github.token }}
          approvers: ${{ secrets.APPROVERS }}
          minimum-approvals: 1
          issue-title: "🚀 Deploy ServiceKU ke Production?"
          issue-body: "Semua tes lolos. Approve untuk melanjutkan deploy."

      - name: Deploy to Production
        if: steps.staging.outputs.enabled == 'true'
        run: |
          echo "Menjalankan deploy ke production..."
          # Contoh deploy via Laravel Forge, Envoyer, atau scp
          # ./vendor/bin/envoyer deploy production --commit=${{ github.sha }}
          gh issue create --title "✅ Production Deployed" --body "Deployment berhasil oleh ${{ github.actor }}." --label "production"

      - name: Skip notice
        if: steps.staging.outputs.enabled == 'false'
        run: echo "⚠️ STAGING_URL masih placeholder — smoke test & approval gate di-skip."

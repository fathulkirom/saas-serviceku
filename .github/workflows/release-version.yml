name: Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (contoh: 1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi

      - name: Update version files
        run: bash scripts/release-version.sh "${{ github.event.inputs.version }}"

      - name: Commit version bump
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION .env.example
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore(release): bump version to v$VERSION"

      - name: Push commit
        run: git push

      - name: Create tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: v${{ github.event.inputs.version }}
          body: |
            Release otomatis untuk versi v${{ github.event.inputs.version }}.

            Perubahan versi:
            - Update file VERSION
            - Sinkron APP_VERSION di .env.example

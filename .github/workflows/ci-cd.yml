name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock berisi symfony 8.1 yang butuh php >=8.4.1
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, pdo, pdo_mysql
          coverage: none
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Install NPM Dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        
      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          # .env.example punya baris DB yang dikomentari (# ...), uncomment dulu
          sed -i 's/DB_CONNECTION=sqlite/DB_CONNECTION=mysql/' .env
          sed -i 's|^# DB_HOST=127.0.0.1$|DB_HOST=127.0.0.1|' .env
          sed -i 's|^# DB_PORT=3306$|DB_PORT=3306|' .env
          sed -i 's|^# DB_DATABASE=laravel$|DB_DATABASE=testing|' .env
          sed -i 's|^# DB_USERNAME=root$|DB_USERNAME=root|' .env
          sed -i 's|^# DB_PASSWORD=$|DB_PASSWORD=password|' .env
          php artisan key:generate
          php artisan migrate --force
          # Landing page butuh data plans agar h1 hero tampil di E2E login test
          php artisan db:seed --force --class=PlanSeeder
          
      - name: Run Backend Tests (PHPUnit / Multi-Tenancy)
        run: php artisan test
        
      - name: Run Frontend Build & Serve
        run: |
          npm run build
          # pakai php -S langsung (php artisan serve tidak baca APP_KEY dari .env)
          php -S 127.0.0.1:8000 -t public public/index.php > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000 > /dev/null 2>&1 && break
            sleep 1
          done
          
      - name: Run E2E Tests (Playwright)
        run: npm run test:e2e
        
      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Build Failed: CI/CD Pipeline',
              body: `The CI/CD pipeline failed on commit **${context.sha}**.\n\n### 🔍 Details\n- **Triggered by:** ${context.eventName}\n- **Branch:** ${context.ref}\n- **Action URL:** [View Failed Run](${runUrl})\n\nPlease investigate and fix the failing tests (PHPUnit / Playwright E2E).`
            })

  # NOTE: Job deploy dihapus dari sini — duplikat dengan .github/workflows/deploy.yml.
  # Jalur deploy tunggal: deploy.yml (immediate SSH deploy) & pre-prod-serviceku.yml
  # (approval-gated deploy). Biarkan workflow ini test-only agar tidak double-deploy.
